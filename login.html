<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barman Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: #0f172a; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 26px;
            color: #2dd4bf; 
        }
        .login-container p {
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            color: #94a3b8;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #2dd4bf, #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .signup-link a { color: #2dd4bf; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>আপনার অ্যাকাউন্টে লগইন করুন</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>ইমেইল অ্যাড্রেস (Email)</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label>পাসওয়ার্ড (Password)</label>
                <input type="password" id="loginPassword" placeholder="আপনার পাসওয়ার্ড দিন" required>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <div class="signup-link">
            নতুন অ্যাকাউন্ট নেই? <a href="signup.html">সাইন-আপ করুন</a>
        </div>
    </div>

    <!-- ফায়ারবেস স্ক্রিপ্ট -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFK97UqNMmV0PLcCiKelBrnxurMXBDLPs",
            authDomain: "barman-market.firebaseapp.com",
            projectId: "barman-market",
            storageBucket: "barman-market.firebasestorage.app",
            messagingSenderId: "1034964147995",
            appId: "1:1034964147995:web:525542140ca017dcbbbdbe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("সফলভাবে লগইন হয়েছে!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে: " + error.message);
                });
        });
    </script>
</body>
</html>
