<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Barman Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: #0f172a; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .signup-container {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        .signup-container h2 { text-align: center; margin-bottom: 5px; font-size: 26px; color: #2dd4bf; }
        .signup-container p { text-align: center; margin-bottom: 25px; font-size: 14px; color: #94a3b8; }
        
        .account-type-selector { display: flex; gap: 15px; margin-bottom: 25px; }
        .type-card {
            flex: 1;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .type-card:hover { border-color: #3b82f6; }
        .type-card input[type="radio"] { display: none; }
        .type-card h3 { font-size: 16px; margin-bottom: 5px; color: #e2e8f0; }
        .type-card span { font-size: 12px; color: #64748b; }
        .type-card input[type="radio"]:checked + h3 { color: #2dd4bf; }
        .type-card input[type="radio"]:checked ~ span { color: #cbd5e1; }
        .type-card:has(input[type="radio"]:checked) {
            border-color: #2dd4bf;
            background-color: rgba(45, 212, 191, 0.05);
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.2);
        }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: #2dd4bf; box-shadow: 0 0 10px rgba(45, 212, 191, 0.2); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #2dd4bf, #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .login-link a { color: #2dd4bf; text-decoration: none; }

        /* প্রিমিয়াম নোটিফিকেশন স্টাইল */
        .custom-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(90deg, #2dd4bf, #3b82f6);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 10px 25px rgba(45, 212, 191, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
        .custom-toast.error { background: linear-gradient(90deg, #ef4444, #f97316); box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Join Barman</h2>
        <p>আপনার অ্যাকাউন্টের ধরন নির্বাচন করুন</p>
        
        <form id="signupForm">
            <div class="account-type-selector">
                <label class="type-card">
                    <input type="radio" name="account_type" value="buyer" checked>
                    <h3>🛒 Buyer</h3>
                    <span>আমি কিনতে চাই</span>
                </label>
                <label class="type-card">
                    <input type="radio" name="account_type" value="vendor">
                    <h3>💼 Vendor</h3>
                    <span>আমি বিক্রি করতে চাই</span>
                </label>
            </div>

            <div class="input-group">
                <label>আপনার নাম (Full Name)</label>
                <input type="text" placeholder="যেমন: রফিকুল ইসলাম" required>
            </div>
            
            <div class="input-group">
                <label>ইমেইল অ্যাড্রেস (Email)</label>
                <input type="email" placeholder="example@email.com" required>
            </div>
            
            <div class="input-group">
                <label>পাসওয়ার্ড (Password)</label>
                <input type="password" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন" required>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="login-link">
            আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a>
        </div>
    </div>

    <!-- কাস্টম নোটিফিকেশন ডিভ -->
    <div id="toast" class="custom-toast"></div>

    <!-- ফায়ারবেস স্ক্রিপ্ট -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFK97UqNMmV0PLcCiKelBrnxurMXBDLPs",
            authDomain: "barman-market.firebaseapp.com",
            projectId: "barman-market",
            storageBucket: "barman-market.firebasestorage.app",
            messagingSenderId: "1034964147995",
            appId: "1:1034964147995:web:525542140ca017dcbbbdbe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // নোটিফিকেশন দেখানোর ফাংশন
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            
            if(isError) {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    showToast("সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে!");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                })
                .catch((error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        showToast("এই ইমেইলটি আগে থেকেই ব্যবহার করা হয়েছে!", true);
                    } else {
                        showToast("সমস্যা হয়েছে: " + error.message, true);
                    }
                });
        });
    </script>
</body>
</html>
