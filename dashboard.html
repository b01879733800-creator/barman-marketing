<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Barman Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: #0f172a; 
            color: #ffffff;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo { font-size: 20px; font-weight: 800; color: #2dd4bf; }
        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .logout-btn:hover { background-color: #dc2626; }
        
        .dashboard-container {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .welcome-card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .welcome-card h1 {
            color: #2dd4bf;
            margin-bottom: 10px;
        }
        .welcome-card p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .email-display {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 18px;
            color: #3b82f6;
            font-weight: 600;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">BARMAN</div>
        <button class="logout-btn" onclick="logout()">Log Out</button>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-card">
            <h1>Welcome to your Dashboard</h1>
            <p>আপনি সফলভাবে লগইন করেছেন। এটি আপনার প্রাইভেট ড্যাশবোর্ড।</p>
            
            <h3>আপনার অ্যাকাউন্ট:</h3>
            <br>
            <div class="email-display" id="userEmail">লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- ফায়ারবেস স্ক্রিপ্ট -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFK97UqNMmV0PLcCiKelBrnxurMXBDLPs",
            authDomain: "barman-market.firebaseapp.com",
            projectId: "barman-market",
            storageBucket: "barman-market.firebasestorage.app",
            messagingSenderId: "1034964147995",
            appId: "1:1034964147995:web:525542140ca017dcbbbdbe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ইউজার লগইন আছে কিনা চেক করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // লগইন থাকলে ইমেইল দেখানো
                document.getElementById('userEmail').innerText = user.email;
            } else {
                // লগইন না থাকলে সোজা লগইন পেজে পাঠিয়ে দেওয়া
                window.location.href = "login.html";
            }
        });

        // লগআউট ফাংশন
        window.logout = function() {
            signOut(auth).then(() => {
                alert("সফলভাবে লগআউট হয়েছেন!");
                window.location.href = "index.html";
            }).catch((error) => {
                alert("লগআউট করতে সমস্যা হয়েছে!");
            });
        }
    </script>
</body>
</html>
