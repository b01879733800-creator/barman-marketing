<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Barman Marketing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
        
        /* Navbar Design */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #334155;
        }
        .logo { font-size: 24px; font-weight: 700; color: #10b981; }
        .logout-btn {
            background-color: #ef4444; color: white; border: none;
            padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        /* Product Grid Design */
        .container { padding: 40px 5%; }
        h2 { margin-bottom: 20px; font-size: 28px; }
        
        #productList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Individual Product Card */
        .product-card {
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 10px;
            background-color: #1e293b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 8px; margin-bottom: 10px;
        }
        .product-card h3 { color: #10b981; margin-bottom: 10px; font-size: 20px; }
        .product-card p { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; line-height: 1.5; }
        .product-price { font-size: 18px; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Barman Marketing</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h2>Available Products</h2>
        <!-- ফায়ারবেস থেকে পণ্য এখানে দেখাবে -->
        <div id="productList">Loading products...</div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDFK97UqNMmV0PLcCiKelBrnxurMXBDLPs",
            authDomain: "barman-market.firebaseapp.com",
            projectId: "barman-market",
            storageBucket: "barman-market.firebasestorage.app",
            messagingSenderId: "1034964147995",
            appId: "1:1034964147995:web:525542140ca017dcbbbdbe"
        };

        // ফায়ারবেস চালু করা
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ১. লগইন চেক করা (লগইন না থাকলে লগইন পেজে পাঠাবে)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // ২. লগআউট ফাংশন
        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        };

        // ৩. ডেটাবেস থেকে পণ্য আনা
        async function loadProducts() {
            const productListDiv = document.getElementById('productList');
            
            // ⚠️ এখানে আপনার কালেকশনের নামটা বসাতে হবে (যেমন: "products")
            const collectionName ="products";
        
            try {
                const querySnapshot = await getDocs(collection(db, collectionName));
                let htmlContent = "";

                if (querySnapshot.empty) {
                    productListDiv.innerHTML = "<p>দুঃখিত, কোনো পণ্য পাওয়া যায়নি।</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // পণ্যের ডিজাইন
                    htmlContent += `
                        <div class="product-card">
                            <img src="${data.imageUrl || 'https://via.placeholder.com/150'}" alt="${data.productName}">
                            <h3>${data.productName}</h3>
                            <p>${data.productDescription}</p>
                            <p><strong>Vendor:</strong> ${data.vendorName}</p>
                            <p class="product-price">৳${data.Price}</p>
                        </div>
                    `;
                });

                productListDiv.innerHTML = htmlContent;

            } catch (error) {
                console.error("Error fetching data: ", error);
                productListDiv.innerHTML = `<p style="color: red;">এরর: ${error.message}</p>`;
            }
        }

        // ফাংশন কল করা
        loadProducts();
    </script>
</body>
</html>
